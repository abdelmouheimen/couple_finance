# Test-only changelog: the production master plus fixtures for shared-kernel integration tests.
# Changeset ids start with "test-" (LiquibaseMigrationIntegrationTest ignores them).
databaseChangeLog:
  - include:
      file: db/changelog/db.changelog-master.yaml
  - changeSet:
      id: test-0001-create-versioned-probe
      author: couplefinance
      comment: Aggregate with a version column used to test ETag / If-Match (Issue #5).
      changes:
        - sql:
            sql: >
              CREATE SCHEMA test_support;
              CREATE TABLE test_support.versioned_probe (
                id uuid PRIMARY KEY,
                owner_user_id uuid NOT NULL,
                name text NOT NULL,
                version bigint NOT NULL DEFAULT 0
              )
  - changeSet:
      id: test-0002-create-idempotent-probe
      author: couplefinance
      comment: Counts executions of an idempotent creating endpoint (Issue #4).
      changes:
        - sql:
            sql: >
              CREATE TABLE test_support.idempotent_probe (
                id uuid PRIMARY KEY,
                owner_user_id uuid NOT NULL,
                name text NOT NULL
              )

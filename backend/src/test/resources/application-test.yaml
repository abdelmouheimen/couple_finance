# Test profile: database comes from Testcontainers (@ServiceConnection); OpenAPI generation enabled for the
# contract test.
springdoc:
  api-docs:
    enabled: true
spring:
  liquibase:
    change-log: classpath:db/changelog/test-master.yaml

# All integration tests share one client address and one context: the production default (300/min per IP) is
# exhausted by the suite on fast machines, so the default profile is effectively unlimited here; dedicated tight
# profiles serve the rate-limit tests on test-support routes only.
couplefinance:
  rate-limit:
    profiles:
      default:
        ip: {capacity: 1000000, period: 1m}
        user: {capacity: 1000000, period: 1m}
      # Production route/profile with a lifted IP budget (shared client address); the per-user budget stays
      # small so the invitation rate-limit test can exhaust it. Tests create fresh users, at most a few calls each.
      invitations:
        ip: {capacity: 1000000, period: 1h}
        user: {capacity: 8, period: 1h}
      # Login: lifted IP budget (shared client address); a small per-account budget serves the 429 test, every
      # other test logs in with its own fresh account.
      auth:
        ip: {capacity: 1000000, period: 1h}
        user: {capacity: 5, period: 1h}
      # Refresh: lifted IP budget (shared client address); the per-session budget serves the 429 test.
      auth-refresh:
        ip: {capacity: 1000000, period: 1h}
        user: {capacity: 25, period: 1h}
      tight-ip:
        ip: {capacity: 3, period: 1h}
        user: {capacity: 1000, period: 1h}
      tight-user:
        ip: {capacity: 1000, period: 1h}
        user: {capacity: 3, period: 1h}
    routes:
      # Lists replace (not merge) the production routes: repeat the production invitation route.
      - {pattern: "/api/v1/households/me/invitations/**", profile: invitations}
      - {pattern: "/api/v1/auth/refresh", profile: auth-refresh}
      - {pattern: "/api/v1/auth/**", profile: auth}
      - {pattern: "/test-support/ratelimit/ip/**", profile: tight-ip}
      - {pattern: "/test-support/ratelimit/user/**", profile: tight-user}

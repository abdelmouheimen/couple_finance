# Base configuration, valid for every environment.
#
# No credentials here (CLAUDE.md §6). Outside the `local` profile the database is configured through the
# environment: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
spring:
  application:
    name: couplefinance
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # Liquibase otherwise sends usage analytics to its vendor at every startup (outbound call + startup delay).
    analytics-enabled: false
  modulith:
    events:
      jdbc:
        # The event publication table is created by Liquibase (infra-0004), never by the library.
        schema: modulith
        schema-initialization:
          enabled: false
  autoconfigure:
    exclude:
      # No authentication mechanism until the identity module exists; never generate a default in-memory user.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    deserialization:
      # Unknown JSON properties are rejected (security.md §5): a client can never smuggle e.g. a user id.
      fail-on-unknown-properties: true

couplefinance:
  security:
    jwt:
      # Access-token validation (security.md §3). Set per environment:
      #   COUPLEFINANCE_SECURITY_JWT_JWK_SET_URI  JWKS endpoint trusted for validation; unset = the public part of the signing key
      #   COUPLEFINANCE_SECURITY_JWT_ISSUER       expected iss claim (optional)
      #   COUPLEFINANCE_SECURITY_JWT_SIGNING_JWK  private P-256 key (JWK JSON) signing the access tokens: a secret, never
      #                                           committed; unset = ephemeral key generated at startup (local only)
      audience: couplefinance-api
  # API hardening conventions (security.md section 5). Values are configurable defaults, not business constants.
  rate-limit:
    enabled: true
    # In-memory buckets per instance; bound on tracked keys per profile and stage (LRU eviction).
    max-tracked-keys: 100000
    # Per-IP limits use the container-resolved client address: behind a reverse proxy set
    # SERVER_FORWARD_HEADERS_STRATEGY (e.g. NATIVE) so clients do not share the proxy's bucket.
    profiles:
      default:
        ip: {capacity: 300, period: 1m}
        user: {capacity: 600, period: 1m}
      # Invitation creation/listing/revocation (BR-HH-04): few legitimate calls, strictly bounded.
      invitations:
        ip: {capacity: 60, period: 1h}
        user: {capacity: 10, period: 1h}
      # Authentication routes: strictly bounded per client address and, for login, per account (hashed email key).
      # Deploy-time values: override per environment.
      auth:
        ip: {capacity: 30, period: 1m}
        user: {capacity: 10, period: 15m}
    # Stricter profiles (invitation redemption, receipt upload) are added with those features.
    routes:
      - {pattern: "/api/v1/auth/**", profile: auth}
      - {pattern: "/api/v1/households/me/invitations/**", profile: invitations}
  pagination:
    # COUPLEFINANCE_PAGINATION_CURSOR_KEY: base64 of 32 random bytes (e.g. `openssl rand -base64 32`).
    # Unset = random per-process key (cursors do not survive restarts or span instances): set it in production.
    cursor-key:
  household:
    defaults:
      currency: EUR
      timezone: Europe/Paris
      period-start-day: 1

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  # Documentation endpoints are disabled by default and enabled in the local and test profiles.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/**
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

# Master changelog. Includes one changelog per module, in dependency order (database.md §5):
#   infra → identity → household → categorization → expense → receipt → budget → savings → ai
# Each module changelog lives in db/changelog/<module>/ and starts with the CREATE SCHEMA changeset.
# Merged changesets are immutable: fix mistakes with new changesets.
databaseChangeLog:
  - include:
      file: db/changelog/infra/infra.changelog.yaml
  - include:
      file: db/changelog/identity/identity.changelog.yaml
  - include:
      file: db/changelog/household/household.changelog.yaml
  - include:
      file: db/changelog/categorization/categorization.changelog.yaml
  - include:
      file: db/changelog/expense/expense.changelog.yaml

# Local development services. Development-only defaults; override them in infra/.env (see .env.example).
# Start: docker compose -f infra/docker-compose.yml up -d
name: couplefinance

services:
  postgres:
    # Same major version as the Testcontainers image used by the backend tests.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-couplefinance}
      POSTGRES_USER: ${POSTGRES_USER:-couplefinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-couplefinance}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Private S3-compatible storage for receipt documents (DOC-001). MinIO no longer publishes images on Docker Hub:
  # this is the pinned, frozen Bitnami build (local development only; production uses a managed S3 service).
  # Server-side encryption (SSE-S3) needs a KMS key: the static key is a development-only default (infra/.env).
  minio:
    image: bitnamilegacy/minio:2025.7.23
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-couplefinance}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-couplefinance-dev}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-couplefinance-dev:OAFSTA7qykGH0cksooWLvemIMMj6CM3+cQYeqXBbbUs=}
    ports:
      # All interfaces so a phone on the LAN can follow presigned URLs (local development only).
      - "${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Malware scanning of uploads (DOC-001, security.md section 6). The first start downloads the signature databases
  # (a few minutes); until clamd answers, uploads are refused (fail-closed).
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10

volumes:
  postgres-data:
  minio-data:
  clamav-data:

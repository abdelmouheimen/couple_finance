openapi: 3.1.0
info:
  description: REST API of the CoupleFinance mobile app. Errors use RFC 9457 Problem
    Details with a stable `code` property.
  title: CoupleFinance API
  version: v1
servers:
- description: Current host
  url: /
security:
- bearerAuth: []
paths:
  /api/v1/analytics/periods/{periodStart}:
    get:
      description: "Total spending of the period, breakdown by category (percentages\
        \ summing to 100.0, negative net categories shown apart) and by payer, comparison\
        \ with the previous period, 3-period average and overall budget consumption.\
        \ Computed on read by the backend from the requested scope only: HOUSEHOLD\
        \ never includes a PERSONAL expense (BR-SCP-01); PERSONAL covers the caller's\
        \ own PERSONAL expenses only (BR-SCP-02, BR-ANA-01), never the partner's,\
        \ with no payer breakdown (empty members) and no budget (BR-BUD-02). A date\
        \ that is not the start of a period of the household calendar is a 404. Readable\
        \ by archive readers of a dissolved household."
      operationId: getPeriodAnalytics
      parameters:
      - description: First day of the budget period (YYYY-MM-DD).
        in: path
        name: periodStart
        required: true
        schema:
          type: string
          format: date
      - description: "HOUSEHOLD, or PERSONAL for the caller's own personal spending."
        in: query
        name: scope
        required: true
        schema:
          type: string
          enum:
          - HOUSEHOLD
          - PERSONAL
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodAnalytics"
          description: The analytics of the period
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED (malformed date, missing or unknown scope)"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND or ANALYTICS_PERIOD_NOT_FOUND
      summary: Household or personal analytics of a budget period
      tags:
      - Analytics
  /api/v1/analytics/periods/{periodStart}/daily-cumulative:
    get:
      description: "For each day of the period (up to today in the household timezone\
        \ for the current period), the cumulative net spending of the requested scope,\
        \ and the overall budget limit for reference when one exists (HOUSEHOLD only).\
        \ HOUSEHOLD never includes a PERSONAL expense (BR-SCP-01); PERSONAL is the\
        \ caller's own only (BR-SCP-02). Computed in integer minor units."
      operationId: getDailyCumulativeSeries
      parameters:
      - description: First day of the budget period (YYYY-MM-DD).
        in: path
        name: periodStart
        required: true
        schema:
          type: string
          format: date
      - description: "HOUSEHOLD, or PERSONAL for the caller's own personal spending."
        in: query
        name: scope
        required: true
        schema:
          type: string
          enum:
          - HOUSEHOLD
          - PERSONAL
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyCumulativeSeries"
          description: The series
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED (malformed date, missing or unknown scope)"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND or ANALYTICS_PERIOD_NOT_FOUND
      summary: Cumulative daily spending of a budget period
      tags:
      - Analytics
  /api/v1/analytics/trend:
    get:
      description: "Net spending totals of the last 6 periods up to and including\
        \ the current one (oldest first), none that ended before the household tracking\
        \ start; fewer when the household has fewer. Same scope rules as the daily\
        \ series."
      operationId: getTrendSeries
      parameters:
      - description: "HOUSEHOLD, or PERSONAL for the caller's own personal spending."
        in: query
        name: scope
        required: true
        schema:
          type: string
          enum:
          - HOUSEHOLD
          - PERSONAL
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendSeries"
          description: The series
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED (missing or unknown scope)
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND
      summary: Net totals of the last 6 budget periods
      tags:
      - Analytics
  /api/v1/auth/login:
    post:
      description: "Public. Creates a session and returns a short-lived access token\
        \ and an opaque refresh token (returned once). Wrong password, unknown email\
        \ and deleted account are indistinguishable (INVALID_CREDENTIALS). An account\
        \ whose email is not verified receives tokens; protected endpoints then answer\
        \ EMAIL_NOT_VERIFIED."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
          description: Tokens issued
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED or MALFORMED_REQUEST
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: INVALID_CREDENTIALS
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: PAYLOAD_TOO_LARGE
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED, with a Retry-After header"
      security: []
      summary: Log in with email and password
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      description: Public. Creates a PENDING_VERIFICATION account and sends a verification
        email. The response is identical whether or not the email is already registered
        (the existing owner receives a notice mail instead; no second account is created).
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "202":
          description: Accepted; a mail is sent in every case
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED (including the password policy)
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: PAYLOAD_TOO_LARGE
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED, with a Retry-After header"
      security: []
      summary: Register an account
      tags:
      - Authentication
  /api/v1/auth/resend-verification:
    post:
      description: Public. Same 202 response whether or not the email is registered
        or already verified.
      operationId: resendVerification
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
        required: true
      responses:
        "202":
          description: Accepted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: PAYLOAD_TOO_LARGE
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED, with a Retry-After header"
      security: []
      summary: Resend the verification email
      tags:
      - Authentication
  /api/v1/auth/verify-email:
    post:
      description: "Public. Consumes a single-use, 24-hour token and makes the account\
        \ ACTIVE. Unknown, expired and already used tokens are indistinguishable (INVALID_OR_EXPIRED_TOKEN)."
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "204":
          description: "Email verified, account ACTIVE"
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: INVALID_OR_EXPIRED_TOKEN or VALIDATION_FAILED
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: PAYLOAD_TOO_LARGE
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "RATE_LIMITED, with a Retry-After header"
      security: []
      summary: Verify an email address
      tags:
      - Authentication
  /api/v1/budgets/{periodStart}:
    get:
      description: "The budget of the household's period starting on periodStart.\
        \ The ETag header carries the version. A date that is not the start of a period\
        \ of the household calendar, and a period without budget, are a 404. When\
        \ an overall limit exists, overallConsumption gives the household spending\
        \ consumed in the period, the remaining amount (negative when exceeded), the\
        \ percentage and the status; computed on read, PERSONAL spending excluded.\
        \ Readable by archive readers of a dissolved household."
      operationId: getBudget
      parameters:
      - description: First day of the budget period (YYYY-MM-DD).
        in: path
        name: periodStart
        required: true
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
          description: The budget
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED (malformed date)
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND, BUDGET_PERIOD_NOT_FOUND or BUDGET_NOT_FOUND"
      summary: Read the budget of a period
      tags:
      - Budgets
    put:
      description: "Sets the limits (overall and per category) of the period starting\
        \ on periodStart: creates the budget (201, no If-Match) or updates it (200).\
        \ Updating requires If-Match with the version (ETag) last read: missing is\
        \ a 428, stale a 412; If-Match on a period without budget is a 412, as is\
        \ losing a creation race. At most one budget per period. A budget needs at\
        \ least one limit, overall or per category: none is a 400 and nothing is stored.\
        \ categoryLimits, when sent, replaces all lines (one per category, new lines\
        \ on active categories of the household only; lines of since-archived categories\
        \ may stay). A category sum above the overall limit is accepted and reported\
        \ as categoryLimitsWarning. Both active members may write; past periods can\
        \ be edited. The change is audited and emits BudgetCreated or BudgetUpdated;\
        \ the new ETag is returned. Rejected on a dissolved household."
      operationId: setBudget
      parameters:
      - description: First day of the budget period (YYYY-MM-DD).
        in: path
        name: periodStart
        required: true
        schema:
          type: string
          format: date
      - description: "Version of the budget last read, as sent in its ETag."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBudgetRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
          description: Budget updated (or unchanged)
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
          description: Budget created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST, IF_MATCH_INVALID, BUDGET_LIMIT_REQUIRED,\
            \ DUPLICATE_CATEGORY_LIMIT, TOO_MANY_CATEGORY_LIMITS, BUDGET_CATEGORY_ARCHIVED,\
            \ INVALID_AMOUNT_FORMAT, TOO_MANY_DECIMALS, AMOUNT_NOT_POSITIVE, AMOUNT_EXCEEDS_MAXIMUM\
            \ or CURRENCY_MISMATCH"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND, BUDGET_PERIOD_NOT_FOUND or CATEGORY_NOT_FOUND\
            \ (unknown or another household's category)"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VERSION_CONFLICT (stale If-Match, or the budget was created\
            \ concurrently)"
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: IF_MATCH_REQUIRED (the budget exists)
      summary: Create or update the budget of a period
      tags:
      - Budgets
  /api/v1/budgets/{periodStart}/copy-previous:
    post:
      description: "Explicit action (BR-BUD-02): creates the budget of the period\
        \ starting on periodStart as a copy of the budget of the period immediately\
        \ preceding it. The overall limit and the category limits are copied; lines\
        \ of since-archived categories are omitted (BR-CAT-03); nothing else is carried\
        \ over (no rollover) and nothing is copied automatically. The new budget records\
        \ copiedFromBudgetId. No request body. 404 when the date is not the start\
        \ of a period (BUDGET_PERIOD_NOT_FOUND) or the preceding period has no budget\
        \ (PREVIOUS_BUDGET_NOT_FOUND); 409 BUDGET_ALREADY_EXISTS when the period already\
        \ has a budget (nothing is overwritten, including when a concurrent request\
        \ wins); 400 BUDGET_LIMIT_REQUIRED when the copy would have no limit (overall\
        \ limit absent and every category archived). Atomic and audited; emits BudgetCreated;\
        \ the ETag is returned. Rejected on a dissolved household."
      operationId: copyPreviousBudget
      parameters:
      - description: First day of the target budget period (YYYY-MM-DD).
        in: path
        name: periodStart
        required: true
        schema:
          type: string
          format: date
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Budget"
          description: Budget created as a copy
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED (malformed date) or BUDGET_LIMIT_REQUIRED
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND, BUDGET_PERIOD_NOT_FOUND or PREVIOUS_BUDGET_NOT_FOUND"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: BUDGET_ALREADY_EXISTS
      summary: Copy the previous period's budget into a period
      tags:
      - Budgets
  /api/v1/categories:
    get:
      description: "System categories followed by the household's own, ordered by\
        \ sort order. Archived categories are flagged and excluded unless includeArchived\
        \ is true. Readable by archive readers of a dissolved household."
      operationId: listCategories
      parameters:
      - description: Include archived categories (flagged archived = true).
        in: query
        name: includeArchived
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPage"
          description: A page of categories
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: INVALID_LIMIT or INVALID_CURSOR
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND
      summary: List categories
      tags:
      - Categories
    post:
      description: Creates an active custom category in the caller's household. The
        ETag header carries its version.
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: Category created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED or MALFORMED_REQUEST
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: CATEGORY_NAME_ALREADY_EXISTS or CATEGORY_LIMIT_REACHED
      summary: Create a custom category
      tags:
      - Categories
  /api/v1/categories/{id}:
    patch:
      description: "Requires If-Match with the category version (ETag). System categories\
        \ cannot be modified. Categories are never deleted: archiving is the delete."
      operationId: updateCategory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "Version of the category last read, as sent in its ETag."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: Category updated (or unchanged)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST or IF_MATCH_INVALID"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "EMAIL_NOT_VERIFIED, HOUSEHOLD_READ_ONLY or SYSTEM_CATEGORY_IMMUTABLE"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND or RESOURCE_NOT_FOUND (also for a category
            of another household)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: CATEGORY_NAME_ALREADY_EXISTS
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VERSION_CONFLICT
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: IF_MATCH_REQUIRED
      summary: "Rename, archive or unarchive a custom category"
      tags:
      - Categories
  /api/v1/category-suggestions:
    get:
      description: "Rule-based suggestion (BR-CAT-04): for PERSONAL the caller's private\
        \ rule, then the household rule; for SHARED the household rule only; otherwise\
        \ the system category Other. Rules pointing to an archived category are skipped.\
        \ The AI step is not available yet. Readable by archive readers of a dissolved\
        \ household."
      operationId: suggestCategory
      parameters:
      - description: Merchant as typed (at most 120 characters).
        in: query
        name: merchant
        required: true
        schema:
          type: string
      - description: Sharing type of the expense being entered.
        in: query
        name: sharingType
        required: true
        schema:
          type: string
          enum:
          - SHARED
          - PERSONAL
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySuggestion"
          description: The suggestion and its source
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND
      summary: Suggest a category for a merchant
      tags:
      - Merchant rules
  /api/v1/expenses:
    get:
      description: "Expense history, newest first (date, then id), cursor-paginated.\
        \ scope=HOUSEHOLD lists the SHARED expenses of the caller's household; scope=PERSONAL\
        \ lists the caller's own PERSONAL expenses. A partner's PERSONAL expenses\
        \ never appear, nor in totals or counts. Deleted expenses are excluded. Filters\
        \ combine with AND. The totals cover every expense matching the filters, not\
        \ only the page, and carry their scope. Readable on a dissolved household\
        \ by a former member with archive access."
      operationId: listExpenses
      parameters:
      - description: Which view to list.
        in: query
        name: scope
        required: true
        schema:
          type: string
          enum:
          - HOUSEHOLD
          - PERSONAL
      - description: First date included (YYYY-MM-DD).
        in: query
        name: dateFrom
        required: false
        schema:
          type: string
          format: date
      - description: Last date included (YYYY-MM-DD).
        in: query
        name: dateTo
        required: false
        schema:
          type: string
          format: date
      - description: Only expenses having an item of this category.
        in: query
        name: categoryId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only expenses paid by this member.
        in: query
        name: paidBy
        required: false
        schema:
          type: string
          format: uuid
      - description: Only this kind.
        in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - EXPENSE
          - REFUND
      - description: Only expenses with (true) or without (false) a receipt.
        in: query
        name: hasReceipt
        required: false
        schema:
          type: boolean
      - description: Case-insensitive text contained in the merchant or the note (max
          100).
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: "Page size, default 20, capped at 100."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - description: Opaque cursor of the previous page.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
          description: A page of expenses
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED (missing or malformed parameter), INVALID_CURSOR,\
            \ INVALID_LIMIT or EXPENSE_FILTER_INVALID"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND (the caller has no household)
      summary: List and search expenses
      tags:
      - Expenses
    post:
      description: "Creates an EXPENSE or a REFUND (optionally linked to an original\
        \ expense) in the caller's household. The household comes from the authenticated\
        \ user. The ETag header carries the version. Send an Idempotency-Key to retry\
        \ safely: the same key and request return the original response (24 h); the\
        \ same key with a different request is a 422; the same key while the first\
        \ request is running is a 409."
      operationId: createExpense
      parameters:
      - description: Client-generated key (1-100 printable ASCII characters) making
          the creation safe to retry.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
          description: Expense created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST, INVALID_AMOUNT_FORMAT,\
            \ TOO_MANY_DECIMALS, AMOUNT_NOT_POSITIVE, AMOUNT_EXCEEDS_MAXIMUM, CURRENCY_MISMATCH,\
            \ EXPENSE_DATE_OUT_OF_RANGE, EXPENSE_ITEM_COUNT_INVALID, EXPENSE_ITEM_DUPLICATE_CATEGORY,\
            \ EXPENSE_ITEMS_SUM_MISMATCH, EXPENSE_CATEGORY_ARCHIVED, EXPENSE_PAID_BY_INVALID,\
            \ EXPENSE_PERSONAL_PAYER_MISMATCH, EXPENSE_MERCHANT_INVALID, EXPENSE_REFUND_OF_NOT_ALLOWED,\
            \ EXPENSE_REFUND_ORIGINAL_INVALID, EXPENSE_REFUND_VISIBILITY_MISMATCH,\
            \ EXPENSE_REFUND_DATE_BEFORE_ORIGINAL, EXPENSE_REFUND_EXCEEDS_ORIGINAL\
            \ or IDEMPOTENCY_KEY_INVALID"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND, EXPENSE_NOT_FOUND (refundOf unknown,\
            \ deleted, of another household or personal to the partner) or CATEGORY_NOT_FOUND\
            \ (also for a category of another household)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: REQUEST_IN_PROGRESS
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: IDEMPOTENCY_KEY_REUSED
      summary: Create an expense or a refund
      tags:
      - Expenses
  /api/v1/expenses/{id}:
    delete:
      description: "Logical deletion (BR-EXP-11): the expense leaves every list, total,\
        \ budget and analytic and can be restored for 90 days. Any member deletes\
        \ a SHARED expense; only the owner a PERSONAL one (the partner gets a 404).\
        \ An expense with live refunds cannot be deleted (409 EXPENSE_HAS_LIVE_REFUNDS).\
        \ The deletion is audited and emits ExpenseDeleted. No If-Match is required:\
        \ deleting is idempotent in effect and a second delete is a 404. Rejected\
        \ on a dissolved household."
      operationId: deleteExpense
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Expense deleted
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND or EXPENSE_NOT_FOUND (unknown, already\
            \ deleted, of another household or personal to the partner)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EXPENSE_HAS_LIVE_REFUNDS
      summary: Delete an expense
      tags:
      - Expenses
    get:
      description: "One expense with its items. The ETag header carries the version.\
        \ A deleted expense, an expense of another household and a PERSONAL expense\
        \ of the partner are all a 404 (BR-EXP-07). Readable by archive readers of\
        \ a dissolved household."
      operationId: getExpense
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
          description: The expense
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND or EXPENSE_NOT_FOUND
      summary: Read an expense
      tags:
      - Expenses
    put:
      description: "Replaces the editable state of an expense (amount, date, items,\
        \ payer, sharing type, merchant, note) with the same validation as creation.\
        \ Requires If-Match with the version (ETag) last read: missing is a 428, stale\
        \ a 412. Any member edits a SHARED expense; only the owner a PERSONAL one\
        \ (the partner gets a 404); only the payer can switch between SHARED and PERSONAL.\
        \ A deleted expense is a 404. The edit is audited and increments the version;\
        \ the new ETag is returned. Rejected on a dissolved household."
      operationId: updateExpense
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "Version of the expense last read, as sent in its ETag."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExpenseRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
          description: Expense updated (or unchanged)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST, IF_MATCH_INVALID, INVALID_AMOUNT_FORMAT,\
            \ TOO_MANY_DECIMALS, AMOUNT_NOT_POSITIVE, AMOUNT_EXCEEDS_MAXIMUM, CURRENCY_MISMATCH,\
            \ EXPENSE_DATE_OUT_OF_RANGE, EXPENSE_ITEM_COUNT_INVALID, EXPENSE_ITEM_DUPLICATE_CATEGORY,\
            \ EXPENSE_ITEMS_SUM_MISMATCH, EXPENSE_CATEGORY_ARCHIVED, EXPENSE_PAID_BY_INVALID,\
            \ EXPENSE_PERSONAL_PAYER_MISMATCH, EXPENSE_MERCHANT_INVALID, EXPENSE_REFUND_ORIGINAL_INVALID,\
            \ EXPENSE_REFUND_VISIBILITY_MISMATCH, EXPENSE_REFUND_DATE_BEFORE_ORIGINAL\
            \ or EXPENSE_REFUND_EXCEEDS_ORIGINAL"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "EMAIL_NOT_VERIFIED, HOUSEHOLD_READ_ONLY or EXPENSE_SHARING_CHANGE_FORBIDDEN"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND, EXPENSE_NOT_FOUND (unknown, deleted,\
            \ of another household or personal to the partner) or CATEGORY_NOT_FOUND"
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VERSION_CONFLICT (stale If-Match)
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: IF_MATCH_REQUIRED
      summary: Update an expense
      tags:
      - Expenses
  /api/v1/expenses/{id}/audit:
    get:
      description: "Who changed what and when (BR-EXP-10), oldest first. Available\
        \ whenever the expense can be read; the audit of a PERSONAL expense is visible\
        \ only to its owner, otherwise 404."
      operationId: getExpenseAudit
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseAuditTrail"
          description: The audit trail
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND or EXPENSE_NOT_FOUND
      summary: Read the audit trail of an expense
      tags:
      - Expenses
  /api/v1/expenses/{id}/restore:
    post:
      description: "Restores a deleted expense within 90 days of its deletion (BR-EXP-11),\
        \ under the same edit rights as deletion. After 90 days, or when the expense\
        \ is not deleted, is unknown, belongs to another household or is personal\
        \ to the partner, the answer is a 404. Restoring a refund re-checks BR-EXP-03\
        \ against its original (400 EXPENSE_REFUND_ORIGINAL_INVALID when the original\
        \ is deleted, EXPENSE_REFUND_EXCEEDS_ORIGINAL, EXPENSE_REFUND_DATE_BEFORE_ORIGINAL,\
        \ EXPENSE_REFUND_VISIBILITY_MISMATCH). Audited; emits ExpenseRestored. The\
        \ restored expense is returned with its new ETag. Rejected on a dissolved\
        \ household."
      operationId: restoreExpense
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
          description: Expense restored
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "EXPENSE_REFUND_ORIGINAL_INVALID, EXPENSE_REFUND_EXCEEDS_ORIGINAL,\
            \ EXPENSE_REFUND_DATE_BEFORE_ORIGINAL or EXPENSE_REFUND_VISIBILITY_MISMATCH"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND or EXPENSE_NOT_FOUND
      summary: Restore a deleted expense
      tags:
      - Expenses
  /api/v1/households:
    post:
      description: Creates a household whose creator — the authenticated user — becomes
        its first active member. A user can belong to only one active household.
      operationId: createHousehold
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
          description: Household created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST, UNSUPPORTED_CURRENCY\
            \ or INVALID_TIMEZONE"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: ALREADY_IN_HOUSEHOLD
      summary: Create a household
      tags:
      - Households
  /api/v1/households/me:
    get:
      description: "Returns the household of the authenticated user, derived server-side.\
        \ A former member of a dissolved household reads it (status DISSOLVED) until\
        \ the archive access expires."
      operationId: getCurrentHousehold
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
          description: The caller's household
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND: no household and no archive access"
      summary: Get the current household
      tags:
      - Households
  /api/v1/households/me/invitations:
    get:
      description: "Open (active, unexpired) invitations created by the caller. Never\
        \ includes the code."
      operationId: listInvitations
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
          description: Open invitations
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND
      summary: List the caller's open invitations
      tags:
      - Households
    post:
      description: Creates a single-use invitation valid 7 days and returns its code
        exactly once. Only the hash of the code is stored. A pending invitation of
        the household is replaced (revoked). Rate-limited per user and per IP.
      operationId: createInvitation
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
          description: Invitation created; the code is shown only now
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY (dissolved)
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVITATION_NOT_ALLOWED: the household does not have exactly\
            \ one active member"
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: RATE_LIMITED
      summary: Invite the partner
      tags:
      - Households
  /api/v1/households/me/invitations/{id}:
    delete:
      description: Revokes an invitation created by the caller; it can never be redeemed
        afterwards. Idempotent for an already revoked invitation.
      operationId: revokeInvitation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Revoked
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND or INVITATION_NOT_FOUND (unknown, other\
            \ household, or created by someone else)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "INVITATION_NOT_REVOCABLE: already redeemed"
      summary: Revoke an invitation
      tags:
      - Households
  /api/v1/me:
    get:
      description: "Returns the identity of the authenticated user, derived from the\
        \ access token only."
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
          description: The caller's identity
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
      summary: Get the authenticated user
      tags:
      - Identity
  /api/v1/merchant-rules:
    put:
      description: "Creates or replaces the rule of the caller's scope for the normalised\
        \ merchant (BR-CAT-05): a household rule for SHARED, a private user rule for\
        \ PERSONAL. Idempotent."
      operationId: setMerchantRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantRuleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantRule"
          description: The rule now in force
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST or CATEGORY_ARCHIVED"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND or RESOURCE_NOT_FOUND (unknown category
            or category of another household)
      summary: Always use this category for this merchant
      tags:
      - Merchant rules
components:
  schemas:
    AnalyticsBudgetSummary:
      type: object
      properties:
        consumed:
          $ref: "#/components/schemas/Money"
        limit:
          $ref: "#/components/schemas/Money"
        percentage:
          type: string
          description: "consumed / limit in percent, one decimal (BR-MON-09)."
          example: "82.5"
        remaining:
          $ref: "#/components/schemas/Money"
          description: limit - consumed; negative when exceeded.
        status:
          type: string
          description: "ON_TRACK below 80.0%, WARNING from 80.0% to 100.0% inclusive,\
            \ EXCEEDED above."
          enum:
          - ON_TRACK
          - WARNING
          - EXCEEDED
    AnalyticsCategoryShare:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        percentage:
          type: string
          description: "Share of the breakdown in percent, one decimal, largest remainder\
            \ (BR-ANA-05)."
          example: "42.5"
        total:
          $ref: "#/components/schemas/Money"
    AnalyticsCategoryTotal:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        total:
          $ref: "#/components/schemas/Money"
    AnalyticsMemberTotal:
      type: object
      properties:
        total:
          $ref: "#/components/schemas/Money"
        userId:
          type: string
          format: uuid
    AnalyticsPreviousPeriod:
      type: object
      properties:
        changePercentage:
          type: string
          description: "difference / previous total in percent, one decimal, HALF_EVEN\
            \ (BR-MON-09); absent unless the previous total is strictly positive."
          example: "-3.2"
        difference:
          $ref: "#/components/schemas/Money"
          description: This period's total minus the previous one's.
        periodEnd:
          type: string
          format: date
        periodStart:
          type: string
          format: date
        total:
          $ref: "#/components/schemas/Money"
    AnalyticsThreePeriodAverage:
      type: object
      properties:
        average:
          $ref: "#/components/schemas/Money"
        periodsUsed:
          type: integer
          format: int32
          description: "Number of periods averaged, 1 to 3."
    Budget:
      type: object
      properties:
        categoryLimits:
          type: array
          description: Category limits of the period; empty when there are none.
          items:
            $ref: "#/components/schemas/CategoryLimit"
        categoryLimitsWarning:
          $ref: "#/components/schemas/CategoryLimitsWarning"
          description: "BR-BUD-04: present when the category limits add up to more\
            \ than the overall limit. Computed on read, never stored, never blocking."
        copiedFromBudgetId:
          type: string
          format: uuid
          description: "BR-BUD-02: id of the budget this one was copied from; absent\
            \ when created from scratch."
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        overallConsumption:
          $ref: "#/components/schemas/LimitConsumption"
          description: "Consumption of the overall limit, computed on read from the\
            \ household spending of the period. Present on GET when an overall limit\
            \ exists; absent in the response of a PUT."
        overallLimit:
          $ref: "#/components/schemas/Money"
        periodEnd:
          type: string
          format: date
          description: "End of the period (exclusive): the start of the next period."
        periodStart:
          type: string
          format: date
          description: First day of the period (inclusive).
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          description: "Version, also sent as ETag."
      required:
      - categoryLimits
      - createdAt
      - createdBy
      - id
      - periodEnd
      - periodStart
      - updatedAt
      - updatedBy
      - version
    Category:
      type: object
      properties:
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
        color:
          type: string
          example: "#9E9E9E"
        icon:
          type: string
          example: tag
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Name of a custom category. Absent on system categories.
          example: Pets
        sortOrder:
          type: integer
          format: int32
        systemCode:
          type: string
          description: Code of a system category; the client displays it translated.
            Absent on custom categories.
          example: GROCERIES
        type:
          type: string
          enum:
          - SYSTEM
          - CUSTOM
          example: CUSTOM
        version:
          type: integer
          format: int64
          description: "Version, also sent as ETag; send it back in If-Match to update."
      required:
      - archived
      - color
      - icon
      - id
      - sortOrder
      - type
      - version
    CategoryLimit:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        limit:
          $ref: "#/components/schemas/Money"
      required:
      - categoryId
      - limit
    CategoryLimitRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: An active system or household category. A category of another
            household is a 404.
        limit:
          $ref: "#/components/schemas/Money"
          description: "Limit for the period, in the household currency, strictly\
            \ positive."
      required:
      - categoryId
      - limit
    CategoryLimitsWarning:
      type: object
      properties:
        categoryLimitsTotal:
          $ref: "#/components/schemas/Money"
          description: Sum of the category limits.
        overallLimit:
          $ref: "#/components/schemas/Money"
          description: The overall limit that the sum exceeds.
      required:
      - categoryLimitsTotal
      - overallLimit
    CategoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        nextCursor:
          type: string
          description: "Opaque cursor of the next page, absent on the last page."
      required:
      - items
    CategorySuggestion:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        source:
          type: string
          description: Where the suggestion comes from. It stays a suggestion until
            the expense is saved (BR-CAT-04).
          enum:
          - USER_RULE
          - HOUSEHOLD_RULE
          - DEFAULT_OTHER
      required:
      - categoryId
      - source
    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          description: "Category name, trimmed, 1 to 40 characters; unique in the\
            \ household, case-insensitively."
          example: Pets
          minLength: 1
      required:
      - name
    CreateExpenseItemRequest:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
          description: "Strictly positive, in the household currency."
        categoryId:
          type: string
          format: uuid
          description: "A system category or a category of the household, not archived."
        label:
          type: string
          maxLength: 60
          minLength: 0
      required:
      - amount
      - categoryId
    CreateExpenseRequest:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
          description: "Total amount, in the household currency, strictly positive."
        date:
          type: string
          format: date
          description: "Calendar date of the expense (YYYY-MM-DD): at most 1 day after\
            \ today in the household time zone, at most 5 years old. A linked refund\
            \ is dated on or after its original."
          example: 2026-05-14
        items:
          type: array
          description: "Category breakdown: 1 to 10 items, one per category, summing\
            \ exactly to the amount. May be omitted only for a REFUND with refundOf:\
            \ the items then default to the original categories, proportionally."
          items:
            $ref: "#/components/schemas/CreateExpenseItemRequest"
          maxItems: 10
          minItems: 0
        kind:
          type: string
          default: EXPENSE
          description: EXPENSE (default) or REFUND.
          enum:
          - EXPENSE
          - REFUND
        merchant:
          type: string
          description: "Merchant name, stored as given."
          maxLength: 120
          minLength: 0
        note:
          type: string
          maxLength: 500
          minLength: 0
        paidByUserId:
          type: string
          format: uuid
          description: A current member of the household. Must be the caller for a
            PERSONAL expense.
        refundOf:
          type: string
          format: uuid
          description: "Original EXPENSE of the same household that the caller can\
            \ see, for a REFUND only. Unknown and invisible originals are both a 404."
        sharingType:
          type: string
          description: "SHARED (default) or PERSONAL (visible only to its owner, the\
            \ caller). A refund with refundOf has the sharing type of its original;\
            \ another value is rejected."
          enum:
          - SHARED
          - PERSONAL
      required:
      - amount
      - date
      - paidByUserId
    CreateHouseholdRequest:
      type: object
      properties:
        currency:
          type: string
          description: ISO 4217 currency code. Defaults to EUR.
          example: EUR
          pattern: "[A-Z]{3}"
        name:
          type: string
          description: "Household name, trimmed."
          example: Notre foyer
          maxLength: 100
          minLength: 1
        periodStartDay:
          type: integer
          format: int32
          description: Day of month on which budget periods start (1-28). Defaults
            to 1.
          example: 1
          maximum: 28
          minimum: 1
        timezone:
          type: string
          description: IANA time-zone id used to compute "today". Defaults to Europe/Paris.
          example: Europe/Paris
          maxLength: 64
          minLength: 1
      required:
      - name
    CreatedInvitation:
      type: object
      properties:
        code:
          type: string
          description: "Single-use secret, shown once. Share it only with the partner."
        expiresAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
      required:
      - code
      - expiresAt
      - id
    CurrentUserResponse:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
          format: uuid
        locale:
          type: string
          description: BCP 47 language tag.
          example: fr-FR
        status:
          type: string
          description: Account status; only ACTIVE accounts reach protected endpoints.
          enum:
          - PENDING_VERIFICATION
          - ACTIVE
    DailyCumulativePoint:
      type: object
      properties:
        cumulative:
          $ref: "#/components/schemas/Money"
          description: Net spending from the period start through this day inclusive.
        date:
          type: string
          format: date
    DailyCumulativeSeries:
      type: object
      properties:
        limit:
          $ref: "#/components/schemas/Money"
          description: Overall budget limit for reference; absent without an overall
            limit and for the PERSONAL scope (BR-BUD-02).
        periodEnd:
          type: string
          format: date
          description: End of the period (exclusive).
        periodStart:
          type: string
          format: date
          description: First day of the period (inclusive).
        points:
          type: array
          description: "One point per day from the period start to the last day of\
            \ the period, or to today in the household timezone for the current period;\
            \ days without spending repeat the previous cumulative; future days are\
            \ absent (empty for a future period)."
          items:
            $ref: "#/components/schemas/DailyCumulativePoint"
        scope:
          type: string
          description: Scope of every figure (BR-SCP-03).
          enum:
          - HOUSEHOLD
          - PERSONAL
      required:
      - periodEnd
      - periodStart
      - points
      - scope
    Expense:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        date:
          type: string
          format: date
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseItem"
        kind:
          type: string
          enum:
          - EXPENSE
          - REFUND
        merchant:
          type: string
        note:
          type: string
        paidByUserId:
          type: string
          format: uuid
        refundOf:
          type: string
          format: uuid
          description: The original expense of a linked REFUND.
        sharingType:
          type: string
          enum:
          - SHARED
          - PERSONAL
        source:
          type: string
          enum:
          - MANUAL
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          description: "Version, also sent as ETag."
      required:
      - amount
      - createdAt
      - createdBy
      - date
      - id
      - items
      - kind
      - paidByUserId
      - sharingType
      - source
      - version
    ExpenseAuditEntry:
      type: object
      properties:
        action:
          type: string
          description: "CREATE, UPDATE, DELETE, RESTORE, ..."
        actorSystem:
          type: string
        actorType:
          type: string
          description: USER or SYSTEM
        actorUserId:
          type: string
          format: uuid
        changes:
          type: object
          additionalProperties: {}
          description: "Field name to {old, new}; amounts are minor units."
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
      required:
      - action
      - actorType
      - changes
      - id
      - occurredAt
    ExpenseAuditTrail:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseAuditEntry"
      required:
      - items
    ExpenseItem:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        categoryId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        label:
          type: string
        position:
          type: integer
          format: int32
      required:
      - amount
      - categoryId
      - id
      - position
    ExpensePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        nextCursor:
          type: string
          description: "Opaque cursor of the next page, absent on the last page."
        totals:
          $ref: "#/components/schemas/ExpenseTotals"
      required:
      - items
      - totals
    ExpenseTotals:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: "Number of matching expenses, all kinds."
        net:
          $ref: "#/components/schemas/Money"
          description: "EXPENSE minus REFUND (TRANSFER excluded, BR-SCP-01); negative\
            \ when refunds exceed expenses. With a category filter, only the items\
            \ of that category."
        scope:
          type: string
          description: "Scope of the figures: HOUSEHOLD (SHARED expenses) or PERSONAL\
            \ (caller's own)."
          enum:
          - HOUSEHOLD
          - PERSONAL
      required:
      - count
      - net
      - scope
    FieldViolation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    Household:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
          example: EUR
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Notre foyer
        periodStartDay:
          type: integer
          format: int32
          example: 1
        status:
          type: string
          enum:
          - ACTIVE
          - DISSOLVED
          example: ACTIVE
        timezone:
          type: string
          example: Europe/Paris
      required:
      - createdAt
      - currency
      - id
      - name
      - periodStartDay
      - status
      - timezone
    Invitation:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
      required:
      - createdAt
      - expiresAt
      - id
    LimitConsumption:
      type: object
      properties:
        consumed:
          $ref: "#/components/schemas/Money"
        percentage:
          type: string
          description: "consumed / limit in percent, one decimal, HALF_EVEN (BR-MON-09);\
            \ a string like Money amounts."
          example: "82.5"
        remaining:
          $ref: "#/components/schemas/Money"
          description: limit - consumed; negative when exceeded.
        scope:
          type: string
          description: "Always HOUSEHOLD: PERSONAL spending is never included (BR-SCP-01,\
            \ BR-SCP-03)."
          enum:
          - HOUSEHOLD
        status:
          type: string
          description: "ON_TRACK below 80.0%, WARNING from 80.0% to 100.0% inclusive,\
            \ EXCEEDED above 100%."
          enum:
          - ON_TRACK
          - WARNING
          - EXCEEDED
    LoginRequest:
      type: object
      properties:
        deviceLabel:
          type: string
          description: "Free label of the device, shown in the session list."
          example: Alex's phone
          maxLength: 80
          minLength: 1
          pattern: "[^\\p{Cntrl}]*\\S[^\\p{Cntrl}]*"
        email:
          type: string
          format: email
          example: alex@example.com
          maxLength: 254
          minLength: 0
        password:
          type: string
          format: password
          description: The account password.
          maxLength: 128
          minLength: 0
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Short-lived ES256 JWT, sent as a Bearer token."
        expiresIn:
          type: integer
          format: int64
          description: Access-token lifetime in seconds.
          example: 900
        refreshToken:
          type: string
          description: "Opaque refresh token, returned only once. Keep it in secure\
            \ storage."
        tokenType:
          type: string
          example: Bearer
    MerchantRule:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        merchantKey:
          type: string
          description: Normalised merchant key the rule applies to.
          example: carrefour
        sharingType:
          type: string
          enum:
          - SHARED
          - PERSONAL
      required:
      - categoryId
      - merchantKey
      - sharingType
    MerchantRuleRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: "A system category or a category of the caller's household,\
            \ not archived."
        merchant:
          type: string
          description: Merchant as typed; normalised by the server (BR-CAT-07).
          example: Carrefour City
          maxLength: 120
          minLength: 0
        sharingType:
          type: string
          description: "SHARED: household rule. PERSONAL: private rule of the caller,\
            \ invisible to the partner."
          enum:
          - SHARED
          - PERSONAL
      required:
      - categoryId
      - merchant
      - sharingType
    Money:
      type: object
      description: An exact amount of a currency.
      properties:
        amount:
          type: string
          description: Plain decimal string with at most the minor-unit decimals of
            the currency.
          example: "12.50"
          pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
        currency:
          type: string
          description: ISO 4217 currency code.
          example: EUR
          pattern: "^[A-Z]{3}$"
    PeriodAnalytics:
      type: object
      properties:
        budget:
          $ref: "#/components/schemas/AnalyticsBudgetSummary"
          description: Overall budget of the period; absent when the period has no
            overall limit.
        categories:
          type: array
          description: "Categories with a net spending of zero or more, largest first,\
            \ with their share of the sum of these categories; the percentages sum\
            \ to exactly 100.0 (BR-ANA-05) unless all are zero."
          items:
            $ref: "#/components/schemas/AnalyticsCategoryShare"
        members:
          type: array
          description: "Net spending by payer, never by creator (BR-ANA-04); empty\
            \ for the PERSONAL scope."
          items:
            $ref: "#/components/schemas/AnalyticsMemberTotal"
        negativeCategories:
          type: array
          description: "Categories whose net spending is negative (refunds above purchases),\
            \ shown as-is and excluded from the percentage breakdown (BR-ANA-06)."
          items:
            $ref: "#/components/schemas/AnalyticsCategoryTotal"
        periodEnd:
          type: string
          format: date
          description: End of the period (exclusive).
        periodStart:
          type: string
          format: date
          description: First day of the period (inclusive).
        previousPeriod:
          $ref: "#/components/schemas/AnalyticsPreviousPeriod"
          description: Comparison with the preceding calendar period; absent when
            there is none.
        scope:
          type: string
          description: "Scope of every figure (BR-SCP-03); HOUSEHOLD never includes\
            \ PERSONAL spending (BR-SCP-01), PERSONAL is the caller's own only (BR-SCP-02)."
          enum:
          - HOUSEHOLD
          - PERSONAL
        threePeriodAverage:
          $ref: "#/components/schemas/AnalyticsThreePeriodAverage"
          description: "BR-ANA-03: average of the up to 3 complete periods preceding\
            \ this one that start on or after the household tracking start; absent\
            \ when none is eligible."
        total:
          $ref: "#/components/schemas/Money"
          description: "Net spending of the period in the scope: expenses minus refunds,\
            \ deleted expenses and transfers excluded."
      required:
      - categories
      - members
      - negativeCategories
      - periodEnd
      - periodStart
      - scope
      - total
    Problem:
      type: object
      description: RFC 9457 Problem Details with a stable `code`.
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: VALIDATION_FAILED
        detail:
          type: string
          example: The request contains invalid values.
        errors:
          type: array
          description: Invalid fields; present for VALIDATION_FAILED.
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          example: /api/v1/households
        status:
          type: integer
          format: int32
          example: 400
        title:
          type: string
          example: Bad Request
        type:
          type: string
          example: about:blank
      required:
      - code
      - status
      - title
    RegisterRequest:
      type: object
      properties:
        displayName:
          type: string
          example: Alex
          maxLength: 60
          minLength: 1
          pattern: "[^\\p{Cntrl}]*"
        email:
          type: string
          format: email
          example: alex@example.com
          maxLength: 254
          minLength: 0
        locale:
          type: string
          description: "BCP 47 language tag, the account preference; defaults to fr-FR."
          example: fr-FR
          maxLength: 35
          minLength: 2
          pattern: "[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*"
        password:
          type: string
          format: password
          description: Between 10 and 128 characters.
          maxLength: 128
          minLength: 10
      required:
      - displayName
      - email
      - password
    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: alex@example.com
          maxLength: 254
          minLength: 0
      required:
      - email
    SetBudgetRequest:
      type: object
      properties:
        categoryLimits:
          type: array
          description: "The complete set of category limits of the period: it replaces\
            \ the existing lines (added, changed and omitted lines are applied). Omitted:\
            \ the existing lines are left untouched; an empty array removes them all.\
            \ At most one line per category (BR-BUD-01). Their sum may exceed the\
            \ overall limit: the response then carries categoryLimitsWarning (BR-BUD-04)."
          items:
            $ref: "#/components/schemas/CategoryLimitRequest"
          maxItems: 200
          minItems: 0
        overallLimit:
          $ref: "#/components/schemas/Money"
          description: "Overall spending limit of the period, in the household currency,\
            \ strictly positive. Omitting it clears it, which is allowed only while\
            \ the budget keeps at least one category limit (BR-BUD-02): otherwise\
            \ 400 and nothing is stored."
    TrendPeriodTotal:
      type: object
      properties:
        current:
          type: boolean
          description: "True for the period containing today, still in progress."
        periodEnd:
          type: string
          format: date
        periodStart:
          type: string
          format: date
        total:
          $ref: "#/components/schemas/Money"
    TrendSeries:
      type: object
      properties:
        periods:
          type: array
          description: "Net totals of the last 6 periods up to and including the current\
            \ one, oldest first; fewer when the household has fewer periods since\
            \ its tracking start."
          items:
            $ref: "#/components/schemas/TrendPeriodTotal"
        scope:
          type: string
          description: Scope of every figure (BR-SCP-03).
          enum:
          - HOUSEHOLD
          - PERSONAL
      required:
      - periods
      - scope
    UpdateCategoryRequest:
      type: object
      properties:
        archived:
          type: boolean
          description: "true archives, false unarchives a custom category."
        name:
          type: string
          description: "New name of a custom category, trimmed, 1 to 40 characters."
          example: Pets
    UpdateExpenseItemRequest:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
          description: "Strictly positive, in the household currency."
        categoryId:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 60
          minLength: 0
      required:
      - amount
      - categoryId
    UpdateExpenseRequest:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
          description: "Total amount, in the household currency, strictly positive."
        date:
          type: string
          format: date
          description: "Calendar date (YYYY-MM-DD). The window of 1 day ahead and\
            \ 5 years back is checked only when the date changes. A linked refund\
            \ stays dated on or after its original, and an original on or before its\
            \ refunds."
          example: 2026-05-14
        items:
          type: array
          description: "Category breakdown: 1 to 10 items, one per category, summing\
            \ exactly to the amount. An item identical (category, amount, label) to\
            \ a current item stays valid on a category archived since; a changed or\
            \ new item needs an active category."
          items:
            $ref: "#/components/schemas/UpdateExpenseItemRequest"
          maxItems: 10
          minItems: 0
        merchant:
          type: string
          description: "Merchant name, stored as given; omitted clears it."
          maxLength: 120
          minLength: 0
        note:
          type: string
          description: Omitted clears it.
          maxLength: 500
          minLength: 0
        paidByUserId:
          type: string
          format: uuid
          description: A current member of the household (checked when it changes).
            Must be the caller for a PERSONAL expense.
        sharingType:
          type: string
          description: "SHARED or PERSONAL. Changing it is reserved to the payer,\
            \ who must also be the creator to make it PERSONAL; a refund keeps the\
            \ sharing type of its original."
          enum:
          - SHARED
          - PERSONAL
      required:
      - amount
      - date
      - items
      - paidByUserId
      - sharingType
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
          description: The opaque token received by email.
          maxLength: 128
          minLength: 0
      required:
      - token
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http

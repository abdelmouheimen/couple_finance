openapi: 3.1.0
info:
  description: REST API of the CoupleFinance mobile app. Errors use RFC 9457 Problem
    Details with a stable `code` property.
  title: CoupleFinance API
  version: v1
servers:
- description: Current host
  url: /
security:
- bearerAuth: []
paths:
  /api/v1/categories:
    get:
      description: "System categories followed by the household's own, ordered by\
        \ sort order. Archived categories are flagged and excluded unless includeArchived\
        \ is true. Readable by archive readers of a dissolved household."
      operationId: listCategories
      parameters:
      - description: Include archived categories (flagged archived = true).
        in: query
        name: includeArchived
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPage"
          description: A page of categories
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: INVALID_LIMIT or INVALID_CURSOR
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND
      summary: List categories
      tags:
      - Categories
    post:
      description: Creates an active custom category in the caller's household. The
        ETag header carries its version.
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: Category created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED or MALFORMED_REQUEST
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: CATEGORY_NAME_ALREADY_EXISTS or CATEGORY_LIMIT_REACHED
      summary: Create a custom category
      tags:
      - Categories
  /api/v1/categories/{id}:
    patch:
      description: "Requires If-Match with the category version (ETag). System categories\
        \ cannot be modified. Categories are never deleted: archiving is the delete."
      operationId: updateCategory
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "Version of the category last read, as sent in its ETag."
        in: header
        name: If-Match
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: Category updated (or unchanged)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST or IF_MATCH_INVALID"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "EMAIL_NOT_VERIFIED, HOUSEHOLD_READ_ONLY or SYSTEM_CATEGORY_IMMUTABLE"
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND or RESOURCE_NOT_FOUND (also for a category
            of another household)
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: CATEGORY_NAME_ALREADY_EXISTS
        "412":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VERSION_CONFLICT
        "428":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: IF_MATCH_REQUIRED
      summary: "Rename, archive or unarchive a custom category"
      tags:
      - Categories
  /api/v1/category-suggestions:
    get:
      description: "Rule-based suggestion (BR-CAT-04): for PERSONAL the caller's private\
        \ rule, then the household rule; for SHARED the household rule only; otherwise\
        \ the system category Other. Rules pointing to an archived category are skipped.\
        \ The AI step is not available yet. Readable by archive readers of a dissolved\
        \ household."
      operationId: suggestCategory
      parameters:
      - description: Merchant as typed (at most 120 characters).
        in: query
        name: merchant
        required: true
        schema:
          type: string
      - description: Sharing type of the expense being entered.
        in: query
        name: sharingType
        required: true
        schema:
          type: string
          enum:
          - SHARED
          - PERSONAL
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySuggestion"
          description: The suggestion and its source
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: VALIDATION_FAILED
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND
      summary: Suggest a category for a merchant
      tags:
      - Merchant rules
  /api/v1/expenses:
    get:
      description: "Expense history, newest first (date, then id), cursor-paginated.\
        \ scope=HOUSEHOLD lists the SHARED expenses of the caller's household; scope=PERSONAL\
        \ lists the caller's own PERSONAL expenses. A partner's PERSONAL expenses\
        \ never appear, nor in totals or counts. Deleted expenses are excluded. Filters\
        \ combine with AND. The totals cover every expense matching the filters, not\
        \ only the page, and carry their scope. Readable on a dissolved household\
        \ by a former member with archive access."
      operationId: listExpenses
      parameters:
      - description: Which view to list.
        in: query
        name: scope
        required: true
        schema:
          type: string
          enum:
          - HOUSEHOLD
          - PERSONAL
      - description: First date included (YYYY-MM-DD).
        in: query
        name: dateFrom
        required: false
        schema:
          type: string
          format: date
      - description: Last date included (YYYY-MM-DD).
        in: query
        name: dateTo
        required: false
        schema:
          type: string
          format: date
      - description: Only expenses having an item of this category.
        in: query
        name: categoryId
        required: false
        schema:
          type: string
          format: uuid
      - description: Only expenses paid by this member.
        in: query
        name: paidBy
        required: false
        schema:
          type: string
          format: uuid
      - description: Only this kind.
        in: query
        name: kind
        required: false
        schema:
          type: string
          enum:
          - EXPENSE
          - REFUND
      - description: Only expenses with (true) or without (false) a receipt.
        in: query
        name: hasReceipt
        required: false
        schema:
          type: boolean
      - description: Case-insensitive text contained in the merchant or the note (max
          100).
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: "Page size, default 20, capped at 100."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
      - description: Opaque cursor of the previous page.
        in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpensePage"
          description: A page of expenses
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED (missing or malformed parameter), INVALID_CURSOR,\
            \ INVALID_LIMIT or EXPENSE_FILTER_INVALID"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND (the caller has no household)
      summary: List and search expenses
      tags:
      - Expenses
    post:
      description: "Creates an EXPENSE or a REFUND (optionally linked to an original\
        \ expense) in the caller's household. The household comes from the authenticated\
        \ user. The ETag header carries the version. Send an Idempotency-Key to retry\
        \ safely: the same key and request return the original response (24 h); the\
        \ same key with a different request is a 422; the same key while the first\
        \ request is running is a 409."
      operationId: createExpense
      parameters:
      - description: Client-generated key (1-100 printable ASCII characters) making
          the creation safe to retry.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
          description: Expense created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST, INVALID_AMOUNT_FORMAT,\
            \ TOO_MANY_DECIMALS, AMOUNT_NOT_POSITIVE, AMOUNT_EXCEEDS_MAXIMUM, CURRENCY_MISMATCH,\
            \ EXPENSE_DATE_OUT_OF_RANGE, EXPENSE_ITEM_COUNT_INVALID, EXPENSE_ITEM_DUPLICATE_CATEGORY,\
            \ EXPENSE_ITEMS_SUM_MISMATCH, EXPENSE_CATEGORY_ARCHIVED, EXPENSE_PAID_BY_INVALID,\
            \ EXPENSE_PERSONAL_PAYER_MISMATCH, EXPENSE_MERCHANT_INVALID, EXPENSE_REFUND_OF_NOT_ALLOWED,\
            \ EXPENSE_REFUND_ORIGINAL_INVALID, EXPENSE_REFUND_VISIBILITY_MISMATCH,\
            \ EXPENSE_REFUND_DATE_BEFORE_ORIGINAL, EXPENSE_REFUND_EXCEEDS_ORIGINAL\
            \ or IDEMPOTENCY_KEY_INVALID"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND, EXPENSE_NOT_FOUND (refundOf unknown,\
            \ deleted, of another household or personal to the partner) or CATEGORY_NOT_FOUND\
            \ (also for a category of another household)"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: REQUEST_IN_PROGRESS
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: IDEMPOTENCY_KEY_REUSED
      summary: Create an expense or a refund
      tags:
      - Expenses
  /api/v1/households:
    post:
      description: Creates a household whose creator — the authenticated user — becomes
        its first active member. A user can belong to only one active household.
      operationId: createHousehold
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHouseholdRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
          description: Household created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST, UNSUPPORTED_CURRENCY\
            \ or INVALID_TIMEZONE"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: ALREADY_IN_HOUSEHOLD
      summary: Create a household
      tags:
      - Households
  /api/v1/households/me:
    get:
      description: "Returns the household of the authenticated user, derived server-side.\
        \ A former member of a dissolved household reads it (status DISSOLVED) until\
        \ the archive access expires."
      operationId: getCurrentHousehold
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Household"
          description: The caller's household
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "HOUSEHOLD_NOT_FOUND: no household and no archive access"
      summary: Get the current household
      tags:
      - Households
  /api/v1/merchant-rules:
    put:
      description: "Creates or replaces the rule of the caller's scope for the normalised\
        \ merchant (BR-CAT-05): a household rule for SHARED, a private user rule for\
        \ PERSONAL. Idempotent."
      operationId: setMerchantRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantRuleRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantRule"
          description: The rule now in force
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: "VALIDATION_FAILED, MALFORMED_REQUEST or CATEGORY_ARCHIVED"
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: AUTHENTICATION_REQUIRED
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: EMAIL_NOT_VERIFIED or HOUSEHOLD_READ_ONLY
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: HOUSEHOLD_NOT_FOUND or RESOURCE_NOT_FOUND (unknown category
            or category of another household)
      summary: Always use this category for this merchant
      tags:
      - Merchant rules
components:
  schemas:
    Category:
      type: object
      properties:
        archived:
          type: boolean
        archivedAt:
          type: string
          format: date-time
        color:
          type: string
          example: "#9E9E9E"
        icon:
          type: string
          example: tag
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Name of a custom category. Absent on system categories.
          example: Pets
        sortOrder:
          type: integer
          format: int32
        systemCode:
          type: string
          description: Code of a system category; the client displays it translated.
            Absent on custom categories.
          example: GROCERIES
        type:
          type: string
          enum:
          - SYSTEM
          - CUSTOM
          example: CUSTOM
        version:
          type: integer
          format: int64
          description: "Version, also sent as ETag; send it back in If-Match to update."
      required:
      - archived
      - color
      - icon
      - id
      - sortOrder
      - type
      - version
    CategoryPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        nextCursor:
          type: string
          description: "Opaque cursor of the next page, absent on the last page."
      required:
      - items
    CategorySuggestion:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        source:
          type: string
          description: Where the suggestion comes from. It stays a suggestion until
            the expense is saved (BR-CAT-04).
          enum:
          - USER_RULE
          - HOUSEHOLD_RULE
          - DEFAULT_OTHER
      required:
      - categoryId
      - source
    CreateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          description: "Category name, trimmed, 1 to 40 characters; unique in the\
            \ household, case-insensitively."
          example: Pets
          minLength: 1
      required:
      - name
    CreateExpenseItemRequest:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
          description: "Strictly positive, in the household currency."
        categoryId:
          type: string
          format: uuid
          description: "A system category or a category of the household, not archived."
        label:
          type: string
          maxLength: 60
          minLength: 0
      required:
      - amount
      - categoryId
    CreateExpenseRequest:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
          description: "Total amount, in the household currency, strictly positive."
        date:
          type: string
          format: date
          description: "Calendar date of the expense (YYYY-MM-DD): at most 1 day after\
            \ today in the household time zone, at most 5 years old. A linked refund\
            \ is dated on or after its original."
          example: 2026-05-14
        items:
          type: array
          description: "Category breakdown: 1 to 10 items, one per category, summing\
            \ exactly to the amount. May be omitted only for a REFUND with refundOf:\
            \ the items then default to the original categories, proportionally."
          items:
            $ref: "#/components/schemas/CreateExpenseItemRequest"
          maxItems: 10
          minItems: 0
        kind:
          type: string
          default: EXPENSE
          description: EXPENSE (default) or REFUND.
          enum:
          - EXPENSE
          - REFUND
        merchant:
          type: string
          description: "Merchant name, stored as given."
          maxLength: 120
          minLength: 0
        note:
          type: string
          maxLength: 500
          minLength: 0
        paidByUserId:
          type: string
          format: uuid
          description: A current member of the household. Must be the caller for a
            PERSONAL expense.
        refundOf:
          type: string
          format: uuid
          description: "Original EXPENSE of the same household that the caller can\
            \ see, for a REFUND only. Unknown and invisible originals are both a 404."
        sharingType:
          type: string
          description: "SHARED (default) or PERSONAL (visible only to its owner, the\
            \ caller). A refund with refundOf has the sharing type of its original;\
            \ another value is rejected."
          enum:
          - SHARED
          - PERSONAL
      required:
      - amount
      - date
      - paidByUserId
    CreateHouseholdRequest:
      type: object
      properties:
        currency:
          type: string
          description: ISO 4217 currency code. Defaults to EUR.
          example: EUR
          pattern: "[A-Z]{3}"
        name:
          type: string
          description: "Household name, trimmed."
          example: Notre foyer
          maxLength: 100
          minLength: 1
        periodStartDay:
          type: integer
          format: int32
          description: Day of month on which budget periods start (1-28). Defaults
            to 1.
          example: 1
          maximum: 28
          minimum: 1
        timezone:
          type: string
          description: IANA time-zone id used to compute "today". Defaults to Europe/Paris.
          example: Europe/Paris
          maxLength: 64
          minLength: 1
      required:
      - name
    Expense:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        date:
          type: string
          format: date
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpenseItem"
        kind:
          type: string
          enum:
          - EXPENSE
          - REFUND
        merchant:
          type: string
        note:
          type: string
        paidByUserId:
          type: string
          format: uuid
        refundOf:
          type: string
          format: uuid
          description: The original expense of a linked REFUND.
        sharingType:
          type: string
          enum:
          - SHARED
          - PERSONAL
        source:
          type: string
          enum:
          - MANUAL
        version:
          type: integer
          format: int64
          description: "Version, also sent as ETag."
      required:
      - amount
      - createdAt
      - createdBy
      - date
      - id
      - items
      - kind
      - paidByUserId
      - sharingType
      - source
      - version
    ExpenseItem:
      type: object
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        categoryId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        label:
          type: string
        position:
          type: integer
          format: int32
      required:
      - amount
      - categoryId
      - id
      - position
    ExpensePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        nextCursor:
          type: string
          description: "Opaque cursor of the next page, absent on the last page."
        totals:
          $ref: "#/components/schemas/ExpenseTotals"
      required:
      - items
      - totals
    ExpenseTotals:
      type: object
      properties:
        count:
          type: integer
          format: int64
          description: "Number of matching expenses, all kinds."
        net:
          $ref: "#/components/schemas/Money"
          description: "EXPENSE minus REFUND (TRANSFER excluded, BR-SCP-01); negative\
            \ when refunds exceed expenses. With a category filter, only the items\
            \ of that category."
        scope:
          type: string
          description: "Scope of the figures: HOUSEHOLD (SHARED expenses) or PERSONAL\
            \ (caller's own)."
          enum:
          - HOUSEHOLD
          - PERSONAL
      required:
      - count
      - net
      - scope
    FieldViolation:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    Household:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        currency:
          type: string
          example: EUR
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Notre foyer
        periodStartDay:
          type: integer
          format: int32
          example: 1
        status:
          type: string
          enum:
          - ACTIVE
          - DISSOLVED
          example: ACTIVE
        timezone:
          type: string
          example: Europe/Paris
      required:
      - createdAt
      - currency
      - id
      - name
      - periodStartDay
      - status
      - timezone
    MerchantRule:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
        merchantKey:
          type: string
          description: Normalised merchant key the rule applies to.
          example: carrefour
        sharingType:
          type: string
          enum:
          - SHARED
          - PERSONAL
      required:
      - categoryId
      - merchantKey
      - sharingType
    MerchantRuleRequest:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: "A system category or a category of the caller's household,\
            \ not archived."
        merchant:
          type: string
          description: Merchant as typed; normalised by the server (BR-CAT-07).
          example: Carrefour City
          maxLength: 120
          minLength: 0
        sharingType:
          type: string
          description: "SHARED: household rule. PERSONAL: private rule of the caller,\
            \ invisible to the partner."
          enum:
          - SHARED
          - PERSONAL
      required:
      - categoryId
      - merchant
      - sharingType
    Money:
      type: object
      description: An exact amount of a currency.
      properties:
        amount:
          type: string
          description: Plain decimal string with at most the minor-unit decimals of
            the currency.
          example: "12.50"
          pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
        currency:
          type: string
          description: ISO 4217 currency code.
          example: EUR
          pattern: "^[A-Z]{3}$"
    Problem:
      type: object
      description: RFC 9457 Problem Details with a stable `code`.
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: VALIDATION_FAILED
        detail:
          type: string
          example: The request contains invalid values.
        errors:
          type: array
          description: Invalid fields; present for VALIDATION_FAILED.
          items:
            $ref: "#/components/schemas/FieldViolation"
        instance:
          type: string
          example: /api/v1/households
        status:
          type: integer
          format: int32
          example: 400
        title:
          type: string
          example: Bad Request
        type:
          type: string
          example: about:blank
      required:
      - code
      - status
      - title
    UpdateCategoryRequest:
      type: object
      properties:
        archived:
          type: boolean
          description: "true archives, false unarchives a custom category."
        name:
          type: string
          description: "New name of a custom category, trimmed, 1 to 40 characters."
          example: Pets
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
